{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card">
  <h2>로그인</h2>
  {% if form.errors %}<p class="errorlist">아이디 또는 비밀번호가 올바르지 않습니다.</p>{% endif %}
  {% if next and not user.is_authenticated %}<p>이 페이지는 로그인이 필요합니다.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">로그인</button>
  </form>
  <p>계정이 없나요? <a href="{% url 'accounts:signup' %}">회원가입</a></p>
</div>
{% endblock %}
